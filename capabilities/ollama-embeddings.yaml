naftiko: 1.0.0-alpha2
info:
  label: Ollama API — Embeddings
  description: 'Ollama API — Embeddings. 1 operations. Lead operation: Ollama Generate embeddings. Self-contained Naftiko
    capability covering one Ollama business surface.'
  tags:
  - Ollama
  - Embeddings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OLLAMA_API_KEY: OLLAMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: ollama-embeddings
    baseUri: http://localhost:11434
    description: Ollama API — Embeddings business capability. Self-contained, no shared references.
    resources:
    - name: api-embed
      path: /api/embed
      operations:
      - name: generateembeddings
        method: POST
        description: Ollama Generate embeddings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: ollama-embeddings-rest
    port: 8080
    description: REST adapter for Ollama API — Embeddings. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/embed
      name: api-embed
      description: REST surface for api-embed.
      operations:
      - method: POST
        name: generateembeddings
        description: Ollama Generate embeddings
        call: ollama-embeddings.generateembeddings
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ollama-embeddings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ollama API — Embeddings. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: ollama-generate-embeddings
      description: Ollama Generate embeddings
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ollama-embeddings.generateembeddings
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
