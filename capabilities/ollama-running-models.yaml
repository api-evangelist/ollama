    capability covering one Ollama business surface.'
  tags:
  - Ollama
  - Running Models
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OLLAMA_API_KEY: OLLAMA_API_KEY
capability:
