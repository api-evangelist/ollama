naftiko: 1.0.0-alpha2
info:
  label: Ollama OpenAI Compatibility API — Completions
  description: 'Ollama OpenAI Compatibility API — Completions. 1 operations. Lead operation: Ollama Create completion. Self-contained
    Naftiko capability covering one Ollama business surface.'
  tags:
  - Ollama
  - Completions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OLLAMA_API_KEY: OLLAMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: openai-compatibility-completions
    baseUri: http://localhost:11434/v1
    description: Ollama OpenAI Compatibility API — Completions business capability. Self-contained, no shared references.
    resources:
    - name: completions
      path: /completions
      operations:
      - name: createcompletion
        method: POST
        description: Ollama Create completion
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.OLLAMA_API_KEY}}'
  exposes:
  - type: rest
    namespace: openai-compatibility-completions-rest
    port: 8080
    description: REST adapter for Ollama OpenAI Compatibility API — Completions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/completions
      name: completions
      description: REST surface for completions.
      operations:
      - method: POST
        name: createcompletion
        description: Ollama Create completion
        call: openai-compatibility-completions.createcompletion
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openai-compatibility-completions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ollama OpenAI Compatibility API — Completions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: ollama-create-completion
      description: Ollama Create completion
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openai-compatibility-completions.createcompletion
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
