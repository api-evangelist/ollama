naftiko: 1.0.0-alpha2
info:
  label: Ollama OpenAI Compatibility API — Embeddings
  description: 'Ollama OpenAI Compatibility API — Embeddings. 1 operations. Lead operation: Ollama Create embeddings. Self-contained
    Naftiko capability covering one Ollama business surface.'
  tags:
  - Ollama
  - Embeddings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OLLAMA_API_KEY: OLLAMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: openai-compatibility-embeddings
    baseUri: http://localhost:11434/v1
    description: Ollama OpenAI Compatibility API — Embeddings business capability. Self-contained, no shared references.
    resources:
    - name: embeddings
      path: /embeddings
      operations:
      - name: createembedding
        method: POST
        description: Ollama Create embeddings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.OLLAMA_API_KEY}}'
  exposes:
  - type: rest
    namespace: openai-compatibility-embeddings-rest
    port: 8080
    description: REST adapter for Ollama OpenAI Compatibility API — Embeddings. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/embeddings
      name: embeddings
      description: REST surface for embeddings.
      operations:
      - method: POST
        name: createembedding
        description: Ollama Create embeddings
        call: openai-compatibility-embeddings.createembedding
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openai-compatibility-embeddings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ollama OpenAI Compatibility API — Embeddings. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: ollama-create-embeddings
      description: Ollama Create embeddings
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openai-compatibility-embeddings.createembedding
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
